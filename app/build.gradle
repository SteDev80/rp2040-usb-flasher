plugins {
    id "com.android.application"
}

android {
    namespace "com.rp2040.usbflasher"
    compileSdk 35

    defaultConfig {
        applicationId "com.rp2040.usbflasher"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            def props = new Properties()
            def propsFile = rootProject.file("local.properties")
            if (propsFile.exists()) {
                propsFile.withInputStream { props.load(it) }
            }

            storeFile file(props.getProperty("RELEASE_STORE_FILE", "../keystore/rp2040-flasher-release.jks"))
            storePassword props.getProperty("RELEASE_STORE_PASSWORD", "")
            keyAlias props.getProperty("RELEASE_KEY_ALIAS", "rp2040-flasher")
            keyPassword props.getProperty("RELEASE_KEY_PASSWORD", "")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation "me.jahnen.libaums:core:0.10.0"
}
